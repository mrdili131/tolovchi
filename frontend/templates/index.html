<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Bindin.uz — Obunalar va avtomatik to‘lovlarni boshqarish</title>
    <meta name="description" content="Bindin.uz — O‘zbekistondagi obunalar va avtomatik to‘lovlarni boshqarish platformasi. Kartangizni ulang, xizmatlarga obuna bo‘ling va oylik to‘lovlarni avtomatik amalga oshiring. Bizneslar uchun avtomatik to‘lovlarni boshqarish imkoniyati.">
    <meta name="keywords" content="Bindin,Bindin.uz,avtomatik to‘lov,avto to‘lov,karta orqali to‘lov,obunalar,obuna boshqarish,oylik to‘lov,automatik yechish,subscription,subscription manager,Uzbekistan,O‘zbekiston,biznes uchun to‘lov,mijoz to‘lovi">
    <meta name="author" content="Bindin.uz">
    <meta name="robots" content="index,follow">
    <meta name="language" content="Uzbek">
    <meta name="application-name" content="Bindin">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://bindin.uz/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bindin.uz">
    <meta property="og:title" content="Bindin.uz — Obunalar va avtomatik to‘lovlar">
    <meta property="og:description" content="Kartangizni ulang,xizmatlarga obuna bo‘ling va oylik to‘lovlarni avtomatik amalga oshiring. Bizneslar esa mijozlarning obuna va to‘lovlarini boshqarishi mumkin.">
    <meta property="og:url" content="https://bindin.uz/">
    <meta property="og:locale" content="uz_UZ">
    <meta property="og:image" content="https://bindin.uz/static/og-image.jpg">
    <meta property="og:image:alt" content="Bindin.uz — avtomatik to‘lovlar va obunalarni boshqarish platformasi">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bindin.uz — Avtomatik to‘lovlar va obunalar">
    <meta name="twitter:description" content="O‘zbekistonda obunalar va kartadan avtomatik to‘lovlarni boshqarish platformasi.">
    <meta name="twitter:image" content="https://bindin.uz/static/og-image.jpg">
    <meta name="description" content="Bindin.uz — Obuna va xizmatlarni boshqarish platformasi.">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    
    <!-- Real QR Libraries -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #004488;
            --primary-hover: #003366;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --text: #0F172A;
            --text-muted: #64748B;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* App Viewport Container */
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-size: 15px;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* App Header */
        header {
            background-color: var(--primary);
            color: var(--surface);
            padding: 0.85rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title img {
            width: 22px;
            height: 22px;
        }

        .user-badge-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
        }

        /* App Scroll Body */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Status Indicators */
        .status-tag {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
        }
        .status-tag.provided, .status-tag.active { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
        .status-tag.pending, .status-tag.inactive { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
        .status-tag.rejected { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }

        /* Auth Screen */
        .auth-container {
            margin: auto 0;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .auth-container h2 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 1.25rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 0 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--surface);
            color: var(--text);
        }

        input:focus, select:focus {
            outline: 2px solid var(--primary);
            border-color: var(--primary);
        }

        button {
            width: 100%;
            height: 48px;
            background-color: var(--primary);
            color: var(--surface);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:active {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-danger {
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-sm {
            height: 36px;
            padding: 0 0.75rem;
            font-size: 0.85rem;
            width: auto;
        }

        /* Screen Views */
        .tab-page {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile-summary {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .list-item {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .list-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .list-item-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Offer / agreement checkbox row */
        .offer-agreement {
            display: flex;
            align-items: flex-start;
            gap: 0.55rem;
            margin-bottom: 1rem;
        }

        .offer-agreement input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            margin-top: 2px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .offer-agreement label {
            margin: 0;
            font-weight: 400;
            font-size: 0.85rem;
            color: var(--text);
            line-height: 1.4;
            cursor: pointer;
        }

        .offer-agreement a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: underline;
        }

        /* Modal Overlays */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 1.25rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #qr-reader-container {
            width: 100%;
            min-height: 240px;
            background: #000;
            margin-bottom: 1rem;
            border-radius: 8px;
            overflow: hidden;
        }

        #qr-reader {
            width: 100%;
            border: none !important;
        }

        #qrDisplayContainer {
            display: flex;
            justify-content: center;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--bg);
            border-radius: 8px;
        }

        .gov-alert-body {
            font-size: 0.9rem;
            padding: 0.85rem;
            border-left: 4px solid var(--primary);
            background: #F8FAFC;
            margin-bottom: 1.25rem;
            border-radius: 4px;
            line-height: 1.4;
        }

        .gov-alert-body.error { border-left-color: var(--danger); background: #FEF2F2; color: #991B1B; }
        .gov-alert-body.success { border-left-color: var(--success); background: #ECFDF5; color: #065F46; }

        /* Bottom Tab Navigation Bar */
        .bottom-nav {
            height: 60px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            gap: 3px;
            font-weight: 500;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(15, 23, 42, 0.35);
            z-index: 4000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: bindin-spin 0.8s linear infinite;
        }

        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: bindin-spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes bindin-spin {
            to { transform: rotate(360deg); }
        }

        /* Skeleton loading rows for lists */
        .skeleton-row {
            height: 56px;
            border-radius: 8px;
            background: linear-gradient(90deg, #EEF2F7 25%, #E2E8F0 37%, #EEF2F7 63%);
            background-size: 400% 100%;
            animation: bindin-shimmer 1.4s ease infinite;
        }

        @keyframes bindin-shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="brand-title"><img src="static/favicon.ico" alt=""> Bindin App</div>
        <div id="userInfo" class="user-badge-container hidden">
            <span id="roleBadge" class="badge">USER</span>
            <button onclick="logout()" class="btn-logout">Chiqish</button>
        </div>
    </header>

    <main>
        <!-- Login / Register Form -->
        <div id="authBlock" class="auth-container">
            <h2 id="authTitle">Tizimga Kirish</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div id="registerNameFields" class="hidden">
                    <div class="form-group">
                        <label>Ism</label>
                        <input type="text" id="firstName" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label>Familiya</label>
                        <input type="text" id="lastName" autocomplete="family-name">
                    </div>
                    <div class="form-group">
                        <label>Sharif (otasining ismi)</label>
                        <input type="text" id="middleName" autocomplete="additional-name">
                    </div>
                </div>
                <div class="form-group">
                    <label>Foydalanuvchi nomi</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Parol</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <div id="confirmPasswordGroup" class="form-group hidden">
                    <label>Parolni tasdiqlash</label>
                    <input type="password" id="password_confirm" autocomplete="new-password">
                </div>
                <div id="offerAgreement" class="offer-agreement hidden">
                    <input type="checkbox" id="offerAccepted" onchange="updateAuthSubmitState()">
                    <label for="offerAccepted">
                        Men <a href="/oferta" target="_blank" rel="noopener">ommaviy oferta</a> shartlari bilan tanishdim va roziman
                    </label>
                </div>
                <button type="submit" id="authSubmitBtn" style="margin-top: 0.5rem;">Kirish</button>
                <button type="button" class="btn-secondary" onclick="toggleAuthMode()" id="authToggleBtn" style="margin-top: 0.5rem;">Ro'yxatdan o'tish</button>
            </form>
        </div>

        <!-- Dashboard Wrapper -->
        <div id="dashboard" class="tab-page hidden">

            <!-- TAB 1: Main View -->
            <div id="tab-main" class="tab-page">
                <div id="profileSection" class="user-profile-summary">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color:var(--text-muted);">F.I.Sh:</span>
                        <strong id="profFullName">--</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color:var(--text-muted);">Username:</span>
                        <strong id="profUsername">--</strong>
                    </div>
                    <div id="serviceBalanceRow" style="display: flex; justify-content: space-between; margin-top: 0.5rem;" class="hidden">
                        <span style="color:var(--text-muted);">Balans:</span>
                        <strong id="profBalance" style="color:var(--success)">0 UZS</strong>
                    </div>
                </div>

                <!-- User Cards View -->
                <div id="userCardSection" class="card hidden">
                    <h2>
                        <span>Bank Kartalari</span>
                        <button onclick="syncCards()" class="btn-secondary btn-sm" id="syncCardsBtn">Yangilash</button>
                    </h2>
                    <button onclick="bindCard()" class="btn-secondary" style="margin-bottom: 0.85rem;" id="bindCardBtn">+ Yangi karta biriktirish</button>
                    <div id="userCardsContainer" class="app-list">
                        <div class="skeleton-row"></div>
                    </div>
                </div>

                <!-- Service Application Form -->
                <div id="serviceAppSection" class="card hidden">
                    <h2>Yangi Ariza Yaratish</h2>
                    <form onsubmit="handleCreateApp(event)">
                        <div class="form-group">
                            <label>Ariza Nomi</label>
                            <input type="text" id="appName" required>
                        </div>
                        <div class="form-group">
                            <label>Tavsif</label>
                            <input type="text" id="appDesc" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                            <div class="form-group">
                                <label>Summa</label>
                                <input type="number" id="appAmount" min="1000" required>
                            </div>
                            <div class="form-group">
                                <label>Kuni (1-31)</label>
                                <input type="number" id="appPayDay" min="1" max="31" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Davriyligi</label>
                            <select id="appFrequency">
                                <option value="monthly">Har oy</option>
                            </select>
                        </div>
                        <button type="submit" id="createAppBtn">Arizani joylashtirish</button>
                    </form>
                </div>
            </div>

            <!-- TAB 2: Applications View -->
            <div id="tab-applications" class="tab-page hidden">
                <div id="userScanAction" class="hidden">
                    <button onclick="openQrScanner()">
                        <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-14h-4V3h4c1.1 0 2 .9 2 2v4h-2V5zM7 7h4v4H7V7zm10 0h-4v4h4V7zM7 17h4v-4H7v4zm5-5h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2zm4 0h2v2h-2v-2zm0-4h2v2h-2v-2z"/></svg>
                        QR Skanerni ochish
                    </button>
                </div>

                <div class="card">
                    <h2>Arizalar Ro'yxati</h2>
                    <div id="applicationsContainer" class="app-list">
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                    </div>
                </div>
            </div>

            <!-- TAB 3: Transactions View -->
            <div id="tab-transactions" class="tab-page hidden">
                <!-- Service Charge Action -->
                <div id="serviceChargeSection" class="card hidden">
                    <h2>Kartadan Yechish</h2>
                    <form onsubmit="handleChargeCard(event)">
                        <div class="form-group">
                            <label>Arizani tanlang</label>
                            <select id="chargeAppSelect" onchange="handleAppSelectChange(this)" required>
                                <option value="">Arizalar yuklanmoqda...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Summa (UZS)</label>
                            <input type="number" id="chargeAmount" min="1000" required placeholder="Masalan: 50000">
                        </div>
                        <button type="submit" id="chargeCardBtn">Mablag'ni Yechish</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Tranzaksiyalar Daftari</h2>
                    <div id="transactionsContainer" class="app-list">
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Navigation Bar -->
    <nav id="bottomNav" class="bottom-nav hidden">
        <div class="nav-item active" data-tab="main" onclick="switchTab('main')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span id="navMainLabel">Asosiy</span>
        </div>
        <div class="nav-item" data-tab="applications" onclick="switchTab('applications')">
            <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
            <span>Arizalar</span>
        </div>
        <div class="nav-item" data-tab="transactions" onclick="switchTab('transactions')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            <span>Daftar</span>
        </div>
    </nav>

    <!-- Scanner Modal -->
    <div id="qrModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom:0.75rem; font-size:1rem;">QR koddagi havolani skanerlang</h3>
            <div id="qr-reader-container">
                <div id="qr-reader"></div>
            </div>
            <button onclick="closeQrScanner()" class="btn-secondary">Kamerani Yopish</button>
        </div>
    </div>

    <!-- QR Display Modal -->
    <div id="qrDisplayModal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <h3 style="margin-bottom:0.5rem; font-size:1rem;">Ariza QR Kodi</h3>
            <p id="qrModalAppDesc" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">--</p>
            <div id="qrDisplayContainer"></div>
            <button onclick="closeQrDisplayModal()" class="btn-secondary">Yopish</button>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="govModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="govModalTitle" style="margin-bottom:0.75rem; font-size:1rem;">Tizim Bildirishnomasi</h3>
            <div id="govModalBody" class="gov-alert-body">--</div>
            <button onclick="closeGovAlert()">Tushundim</button>
        </div>
    </div>

    <!-- Global Loading Overlay -->
    <div id="globalLoader" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script>
        const API_BASE = "https://bindin.uz/api";
        let isRegisterMode = false;
        let html5QrCodeEngine = null;
        let activeLoaders = 0;

        // ---------- Loading indicator helpers ----------
        function showLoader() {
            activeLoaders++;
            document.getElementById("globalLoader").classList.remove("hidden");
        }

        function hideLoader() {
            activeLoaders = Math.max(0, activeLoaders - 1);
            if (activeLoaders === 0) {
                document.getElementById("globalLoader").classList.add("hidden");
            }
        }

        // Puts a button into a disabled "loading" state with an inline spinner,
        // and returns a restore function to call once the request finishes.
        function setButtonLoading(button, loadingText) {
            if (!button) return () => {};
            const originalHTML = button.innerHTML;
            const originalDisabled = button.disabled;
            button.disabled = true;
            button.innerHTML = `<span class="btn-spinner"></span>${loadingText ? `<span>${loadingText}</span>` : ''}`;
            return () => {
                button.innerHTML = originalHTML;
                button.disabled = originalDisabled;
            };
        }

        function showAlert(message, type = 'info', title = 'Tizim Bildirishnomasi') {
            document.getElementById("govModalTitle").innerText = title;
            const body = document.getElementById("govModalBody");
            body.innerText = message;
            body.className = `gov-alert-body ${type}`;
            document.getElementById("govModal").classList.remove("hidden");
        }

        function closeGovAlert() {
            document.getElementById("govModal").classList.add("hidden");
        }

        // Enables/disables the submit button based on mode + offer checkbox state.
        // In register mode the offer must be accepted before the button can be used.
        function updateAuthSubmitState() {
            const submitBtn = document.getElementById("authSubmitBtn");
            if (!submitBtn) return;
            if (isRegisterMode) {
                const accepted = document.getElementById("offerAccepted").checked;
                submitBtn.disabled = !accepted;
            } else {
                submitBtn.disabled = false;
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("authTitle").innerText = isRegisterMode ? "Ro'yxatdan O'tish" : "Tizimga Kirish";
            document.getElementById("authSubmitBtn").innerText = isRegisterMode ? "Hisob Yaratish" : "Kirish";
            document.getElementById("authToggleBtn").innerText = isRegisterMode ? "Kirishga o'tish" : "Ro'yxatdan o'tish";
            document.getElementById("confirmPasswordGroup").classList.toggle("hidden", !isRegisterMode);
            document.getElementById("registerNameFields").classList.toggle("hidden", !isRegisterMode);
            document.getElementById("offerAgreement").classList.toggle("hidden", !isRegisterMode);

            // Name fields are only required in register mode
            document.getElementById("firstName").required = isRegisterMode;
            document.getElementById("lastName").required = isRegisterMode;
            document.getElementById("middleName").required = isRegisterMode;

            // Reset the offer checkbox whenever the mode is switched
            document.getElementById("offerAccepted").checked = false;
            updateAuthSubmitState();
        }

        function formatUserFullName(usr) {
            if (!usr) return 'Mavjud emas';
            const parts = [usr.last_name, usr.first_name, usr.middle_name].filter(Boolean);
            return parts.length > 0 ? parts.join(' ') : (usr.username || 'Mavjud emas');
        }

        async function extractErrorMessage(res) {
            try {
                const data = await res.json();
                if (data.detail && Array.isArray(data.detail)) {
                    return data.detail.map(e => e.msg).join(', ');
                }
                return data.detail || "Xatolik yuz berdi.";
            } catch {
                return "Noma'lum xatolik yuz berdi.";
            }
        }

        async function handleAuth(e) {
            e.preventDefault();

            // Extra safety net: even if the button was somehow enabled, never submit
            // a registration without offer acceptance.
            if (isRegisterMode && !document.getElementById("offerAccepted").checked) {
                showAlert("Davom etish uchun ommaviy oferta shartlariga rozilik bildiring.", "error");
                return;
            }

            const submitBtn = document.getElementById("authSubmitBtn");
            const restoreBtn = setButtonLoading(submitBtn, isRegisterMode ? "Yaratilmoqda..." : "Kirilmoqda...");

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                if (isRegisterMode) {
                    const password_confirm = document.getElementById("password_confirm").value;
                    const first_name = document.getElementById("firstName").value;
                    const last_name = document.getElementById("lastName").value;
                    const middle_name = document.getElementById("middleName").value;
                    const offer_accepted = document.getElementById("offerAccepted").checked;

                    showLoader();
                    const res = await fetch(`${API_BASE}/auth/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password, password_confirm, first_name, last_name, middle_name, offer_accepted })
                    }).finally(hideLoader);

                    if (res.ok) {
                        showAlert("Ro'yxatdan o'tish muvaffaqiyatli yakunlandi.", "success");
                        toggleAuthMode();
                    } else {
                        const err = await extractErrorMessage(res);
                        showAlert(`Xatolik: ${err}`, "error");
                    }
                } else {
                    const formData = new URLSearchParams();
                    formData.append("username", username);
                    formData.append("password", password);

                    showLoader();
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData
                    }).finally(hideLoader);

                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem("token", data.access_token);
                        localStorage.setItem("role", data.role);
                        initDashboard();
                    } else {
                        const err = await extractErrorMessage(res);
                        showAlert(`Kirishda xatolik: ${err}`, "error");
                    }
                }
            } finally {
                restoreBtn();
            }
        }

        function logout() {
            localStorage.clear();
            location.hash = "";
            location.reload();
        }

        // Every authenticated API call automatically shows/hides the global loader.
        async function apiFetch(endpoint, options = {}) {
            const token = localStorage.getItem("token");
            const headers = {
                ...options.headers,
                "Authorization": `Bearer ${token}`
            };
            showLoader();
            try {
                return await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            } finally {
                hideLoader();
            }
        }

        async function loadProfile() {
            const role = localStorage.getItem("role");
            const endpoint = role === 'service' ? '/auth/me_service' : '/auth/me';
            const res = await apiFetch(endpoint);
            if (res.ok) {
                const profile = await res.json();
                document.getElementById("profFullName").innerText = formatUserFullName(profile);
                document.getElementById("profUsername").innerText = profile.username || 'Mavjud emas';

                // Balance is a service-account concept only — regular users never see it.
                if (role === 'service') {
                    document.getElementById("serviceBalanceRow").classList.remove("hidden");
                    document.getElementById("profBalance").innerText = `${profile.balance || 0} UZS`;
                }
            }
        }

        async function initDashboard() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");
            if (!token) return;

            document.getElementById("authBlock").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            document.getElementById("userInfo").classList.remove("hidden");
            document.getElementById("bottomNav").classList.remove("hidden");
            document.getElementById("roleBadge").innerText = role ? role.toUpperCase() : 'USER';

            loadProfile();

            if (role === 'user') {
                document.getElementById("userCardSection").classList.remove("hidden");
                document.getElementById("userScanAction").classList.remove("hidden");
                document.getElementById("navMainLabel").innerText = "Kartalar";
                loadCards();
            } else if (role === 'service') {
                document.getElementById("serviceAppSection").classList.remove("hidden");
                document.getElementById("serviceChargeSection").classList.remove("hidden");
                document.getElementById("navMainLabel").innerText = "Yaratish";
            }

            const currentHash = window.location.hash.replace('#', '');
            const initialTab = ['main', 'applications', 'transactions'].includes(currentHash) ? currentHash : 'main';
            switchTab(initialTab, false);

            loadApplications();
            loadTransactions();
        }

        function switchTab(tabName, updateHash = true) {
            const validTabs = ['main', 'applications', 'transactions'];
            if (!validTabs.includes(tabName)) tabName = 'main';

            if (updateHash) {
                window.location.hash = tabName;
            }

            document.querySelectorAll('#tab-main, #tab-applications, #tab-transactions').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetNav = document.querySelector(`.nav-item[data-tab="${tabName}"]`);
            if (targetTab) targetTab.classList.remove('hidden');
            if (targetNav) targetNav.classList.add('active');
        }

        window.addEventListener('hashchange', () => {
            const currentHash = window.location.hash.replace('#', '');
            if (currentHash) switchTab(currentHash, false);
        });

        // CARDS API
        async function loadCards() {
            const container = document.getElementById("userCardsContainer");
            container.innerHTML = '<div class="skeleton-row"></div>';

            const res = await apiFetch("/card/");
            if (res.ok) {
                const cards = await res.json();
                if (!cards || cards.length === 0) {
                    container.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted);">Kartalar mavjud emas.</p>';
                    return;
                }
                // Card's internal database id is never shown to the user — only holder name and masked PAN.
                // The id is still used internally (data attribute) so the remove button knows which card to delete.
                container.innerHTML = cards.map(c => `
                    <div class="list-item" data-card-id="${c.id}">
                        <div class="list-item-info">
                            <span class="list-item-title">${c.holder || 'Karta'}</span>
                            <span class="list-item-sub">${c.pan || '•••• ••••'}</span>
                        </div>
                        <button
                            type="button"
                            class="btn-secondary btn-sm btn-danger"
                            style="margin-left:0.75rem;"
                            onclick="removeCard(${c.id}, this)"
                        >O'chirish</button>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted);">Kartalarni yuklab bo\'lmadi.</p>';
            }
        }

        async function syncCards() {
            const restore = setButtonLoading(document.getElementById("syncCardsBtn"));
            try {
                const res = await apiFetch("/card/update");
                if (res.status === 204 || res.ok) {
                    showAlert("Kartalar yangilandi.", "success");
                    await loadCards();
                } else {
                    showAlert("Kartalarni yangilashda xatolik.", "error");
                }
            } finally {
                restore();
            }
        }

        async function removeCard(cardId, buttonEl) {
            const listItem = buttonEl.closest('.list-item');
            const cardLabel = listItem ? listItem.querySelector('.list-item-title').innerText : 'karta';

            const confirmed = confirm(`"${cardLabel}" kartasini olib tashlamoqchimisiz?`);
            if (!confirmed) return;

            const restore = setButtonLoading(buttonEl);
            try {
                const res = await apiFetch(`/card/remove/${cardId}`, { method: "POST" });
                if (res.ok) {
                    const data = await res.json();
                    showAlert(data.detail || "Karta olib tashlandi.", "success");
                    loadCards();
                } else {
                    const err = await extractErrorMessage(res);
                    showAlert(`Kartani olib tashlashda xatolik: ${err}`, "error");
                    restore();
                }
            } catch (err) {
                showAlert("Kartani olib tashlashda xatolik.", "error");
                restore();
            }
        }

        async function bindCard() {
            const restore = setButtonLoading(document.getElementById("bindCardBtn"), "Ochilmoqda...");
            try {
                const returnUrl = encodeURIComponent(window.location.href);
                const res = await apiFetch(`/card/bind?return_url=${returnUrl}`);
                if (res.ok) {
                    const data = await res.json();
                    window.open(data.card_link_url, '_blank');
                } else {
                    showAlert("Karta biriktirishda xatolik.", "error");
                }
            } finally {
                restore();
            }
        }

        // APPLICATION API
        async function handleCreateApp(e) {
            e.preventDefault();
            const restore = setButtonLoading(document.getElementById("createAppBtn"), "Yaratilmoqda...");
            try {
                const payload = {
                    name: document.getElementById("appName").value,
                    description: document.getElementById("appDesc").value,
                    amount: parseInt(document.getElementById("appAmount").value),
                    frequency: document.getElementById("appFrequency").value,
                    pay_day: parseInt(document.getElementById("appPayDay").value)
                };

                const res = await apiFetch("/application/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showAlert("Ariza yaratildi.", "success");
                    document.getElementById("appName").value = '';
                    document.getElementById("appDesc").value = '';
                    document.getElementById("appAmount").value = '';
                    document.getElementById("appPayDay").value = '';
                    loadApplications();
                } else {
                    const err = await extractErrorMessage(res);
                    showAlert(`Xatolik: ${err}`, "error");
                }
            } finally {
                restore();
            }
        }

        function populateChargeAppDropdown(apps) {
            const select = document.getElementById("chargeAppSelect");
            if (!select) return;

            const chargeableApps = apps.filter(a => a.is_active || a.payer_id || a.card_id);

            if (chargeableApps.length === 0) {
                select.innerHTML = '<option value="">Faol arizalar topilmadi</option>';
                return;
            }

            // card_id is kept only as an internal data attribute for the charge request —
            // it is never rendered as visible text.
            select.innerHTML = '<option value="">-- Arizani tanlang --</option>' + 
                chargeableApps.map(a => {
                    const cardId = a.card_id || (a.card && a.card.id) || '';
                    const appAmount = a.amount || 0;
                    return `<option value="${a.id}" data-card-id="${cardId}" data-amount="${appAmount}">
                        ${a.name || 'Nomsiz'} (#${a.id}) - ${appAmount} UZS
                    </option>`;
                }).join('');
        }

        function handleAppSelectChange(selectElem) {
            const selectedOption = selectElem.options[selectElem.selectedIndex];
            const defaultAmount = selectedOption.getAttribute("data-amount");
            if (defaultAmount) {
                document.getElementById("chargeAmount").value = defaultAmount;
            }
        }

        async function loadApplications() {
            const role = localStorage.getItem("role");
            const container = document.getElementById("applicationsContainer");
            container.innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div>';

            const res = await apiFetch("/application/");
            if (res.ok) {
                const apps = await res.json();

                if (role === 'service') {
                    populateChargeAppDropdown(apps);
                }

                if (!apps || apps.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Mavjud emas</p>';
                    return;
                }

                // Regular users only see the payment schedule, not the application's balance —
                // that figure is only meaningful to the service account managing it.
                container.innerHTML = apps.map(a => {
                    const hasPayer = a.payer_id !== null && a.payer_id !== undefined;
                    const canShowQr = role === 'service' && (!a.is_active && !hasPayer);
                    const balanceInfo = role === 'service' ? ` | Balans: ${a.balance || 0} UZS` : '';

                    return `
                        <div class="list-item">
                            <div class="list-item-info">
                                <span class="list-item-title">${a.name || 'Nomsiz'} <small style="color:var(--text-muted)">(#${a.id})</small></span>
                                <span class="list-item-sub">Sana: ${a.pay_day} (${a.frequency})${balanceInfo}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:0.5rem;">
                                <span class="status-tag ${a.is_active ? 'active' : 'inactive'}">
                                    ${a.is_active ? 'Faol' : 'Nofaol'}
                                </span>
                                ${canShowQr ? `<button onclick="generateQrModal('${a.id}', '${encodeURIComponent(a.name || a.description)}')" class="btn-secondary btn-sm">QR</button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Ma\'lumotlarni yuklab bo\'lmadi</p>';
            }
        }

        function generateQrModal(appId, appDesc) {
            const targetUrl = `${API_BASE}/application/link/${appId}`;
            const container = document.getElementById("qrDisplayContainer");
            container.innerHTML = "";
            
            document.getElementById("qrModalAppDesc").innerText = `Ariza #${appId}: ${decodeURIComponent(appDesc)}`;

            new QRCode(container, {
                text: targetUrl,
                width: 200,
                height: 200,
                colorDark : "#004488",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById("qrDisplayModal").classList.remove("hidden");
        }

        function closeQrDisplayModal() {
            document.getElementById("qrDisplayModal").classList.add("hidden");
        }

        async function openQrScanner() {
            document.getElementById("qrModal").classList.remove("hidden");
            if (html5QrCodeEngine) await closeQrScanner();

            try {
                html5QrCodeEngine = new Html5Qrcode("qr-reader");
                const qrConfig = { fps: 10, qrbox: { width: 200, height: 200 } };
                const cameras = await Html5Qrcode.getCameras();
                
                if (cameras && cameras.length > 0) {
                    await html5QrCodeEngine.start(cameras[cameras.length - 1].id, qrConfig, onScanSuccess, onScanFailure);
                } else {
                    await html5QrCodeEngine.start({ facingMode: "environment" }, qrConfig, onScanSuccess, onScanFailure);
                }
            } catch (err) {
                showAlert("Kamerani ishga tushirib bo'lmadi.", "error");
                closeQrScanner();
            }
        }

        async function closeQrScanner() {
            if (html5QrCodeEngine) {
                try {
                    await html5QrCodeEngine.stop();
                    html5QrCodeEngine.clear();
                } catch(e) {}
                html5QrCodeEngine = null;
            }
            document.getElementById("qrModal").classList.add("hidden");
        }

        async function onScanSuccess(decodedText) {
            await closeQrScanner();
            let targetUrl = decodedText;
            if (!isNaN(decodedText)) {
                targetUrl = `${API_BASE}/application/link/${decodedText}`;
            }

            showLoader();
            try {
                const res = await fetch(targetUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`,
                        "Content-Type": "application/json"
                    }
                });

                if (res.ok) {
                    const data = await res.json();
                    showAlert(`Ariza ulandi!\nHolati: ${data.status ? 'Muvaffaqiyatli' : 'Muvaffaqiyatsiz'}\nTafsilot: ${data.detail}`, "success");
                    loadApplications();
                } else {
                    const err = await extractErrorMessage(res);
                    showAlert(`QR ulashda xatolik: ${err}`, "error");
                }
            } catch (err) {
                showAlert("QR havolani bajarishda xatolik.", "error");
            } finally {
                hideLoader();
            }
        }

        function onScanFailure(error) {}

        // TRANSACTIONS & CHARGE API
        async function handleChargeCard(e) {
            e.preventDefault();
            const restore = setButtonLoading(document.getElementById("chargeCardBtn"), "Yechilmoqda...");
            try {
                const select = document.getElementById("chargeAppSelect");
                const selectedOption = select.options[select.selectedIndex];

                const applicationId = parseInt(select.value);
                const cardIdAttr = selectedOption ? selectedOption.getAttribute("data-card-id") : null;
                const parsedCardId = parseInt(cardIdAttr);
                const amount = parseInt(document.getElementById("chargeAmount").value);

                if (!applicationId) {
                    showAlert("Iltimos, arizani tanlang.", "error");
                    return;
                }

                // Build strictly valid integer payload fields
                const payload = {
                    application_id: applicationId,
                    amount: amount
                };

                if (!isNaN(parsedCardId) && parsedCardId > 0) {
                    payload.card_id = parsedCardId;
                }

                const res = await apiFetch("/card/charge", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showAlert("Mablag' yechildi.", "success");
                    document.getElementById("chargeAmount").value = '';
                    loadTransactions();
                    loadApplications();
                    loadProfile();
                } else {
                    const err = await extractErrorMessage(res);
                    showAlert(`Mablag' yechishda xatolik: ${err}`, "error");
                }
            } finally {
                restore();
            }
        }

        async function loadTransactions() {
            const container = document.getElementById("transactionsContainer");
            container.innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div>';

            const res = await apiFetch("/transaction/");

            if (res.ok) {
                const txs = await res.json();

                if (!txs || txs.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Tranzaksiyalar mavjud emas</p>';
                    return;
                }

                container.innerHTML = txs.map(t => {
                    const senderName = formatUserFullName(t.sender);
                    const receiverName = formatUserFullName(t.receiver);

                    return `
                        <div class="list-item">
                            <div class="list-item-info">
                                <span class="list-item-title">${t.amount} UZS</span>
                                <span class="list-item-sub">#${t.id} | ${senderName} -> ${receiverName}</span>
                            </div>
                            <span class="status-tag ${t.status}">${t.status}</span>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Ma\'lumotlarni yuklab bo\'lmadi</p>';
            }
        }

        window.onload = () => {
            if (localStorage.getItem("token")) {
                initDashboard();
            }
        };
    </script>
</body>
</html>
