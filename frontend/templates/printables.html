<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bindin - Kassa Hisoboti</title>
  <link rel="icon" type="image/x-icon" href="static/favicon.ico">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .hidden { display: none !important; }

    /* AUTHENTICATION */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .login-card {
      background: var(--card);
      width: 100%;
      max-width: 380px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand-header img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .brand-header h2 { font-size: 22px; font-weight: 700; color: var(--primary); }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #334155; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: #1d4ed8; }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-block { width: 100%; }
    .error { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; }

    /* DASHBOARD */
    .container { max-width: 1100px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-title { display: flex; align-items: center; gap: 12px; }
    .logo-title img { width: 32px; height: 32px; }
    .logo-title h1 { font-size: 22px; font-weight: 700; }

    .control-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }

    /* DATA TABLE */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    table.data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    table.data-table th {
      background: #f8fafc;
      padding: 12px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      border-bottom: 1px solid var(--border);
    }
    table.data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr:hover { background: #f8fafc; }
    .badge-id { font-family: monospace; font-weight: 700; color: var(--accent); }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff; padding: 0; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="login-wrapper no-print">
    <div class="login-card">
      <div class="brand-header">
        <img src="static/favicon.ico" alt="Bindin Logo">
        <h2>Bindin</h2>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Foydalanuvchi nomi</label>
          <input type="text" id="username" placeholder="Login" required>
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Kirish</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="container no-print hidden">
    <div class="header-bar">
      <div class="logo-title">
        <img src="static/favicon.ico" alt="Bindin Logo">
        <h1>Bindin — Kassa Hisoboti</h1>
      </div>
      <button onclick="logout()" class="btn btn-secondary">Chiqish</button>
    </div>

    <div class="control-panel">
      <label class="checkbox-label">
        <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)">
        Barchasini tanlash
      </label>
      <div style="display: flex; align-items: center; gap: 15px;">
        <span id="selected-count" style="font-size: 14px; font-weight: 600; color: #64748b;">Tanlandi: 0</span>
        <button onclick="printSelectedReport()" class="btn btn-accent">📄 Hisobotni chop etish</button>
      </div>
    </div>

    <div id="status-message" style="margin-bottom: 12px; font-size: 14px; color: #64748b;">
      Yuklanmoqda...
    </div>

    <div class="table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 40px; text-align: center;">#</th>
            <th>Tranzaksiya №</th>
            <th>Sana</th>
            <th>To'lovchi (Mijoz)</th>
            <th>Qabul qiluvchi</th>
            <th>Summa</th>
          </tr>
        </thead>
        <tbody id="transactions-list-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://bindin.uz';
    let rawTransactions = [];

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('login-error');
      errorDiv.textContent = '';

      const formData = new URLSearchParams();
      formData.append('username', document.getElementById('username').value);
      formData.append('password', document.getElementById('password').value);

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (!response.ok) throw new Error('Login yoki parol xato!');

        const data = await response.json();
        localStorage.setItem('access_token', data.access_token);
        showDashboard();
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    });

    async function fetchTransactions() {
      const token = localStorage.getItem('access_token');
      const statusMsg = document.getElementById('status-message');

      try {
        const response = await fetch(`${API_BASE_URL}/api/transaction/`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Tranzaksiyalarni yuklashda xatolik');

        rawTransactions = await response.json();
        
        if (!rawTransactions || rawTransactions.length === 0) {
          statusMsg.textContent = 'Tranzaksiyalar topilmadi.';
          return;
        }

        statusMsg.textContent = `Jami ${rawTransactions.length} ta tranzaksiya mavjud.`;
        renderTable(rawTransactions);
      } catch (err) {
        statusMsg.textContent = 'Xatolik: ' + err.message;
      }
    }

    function renderTable(transactions) {
      const tbody = document.getElementById('transactions-list-body');
      tbody.innerHTML = transactions.map(tx => {
        const clientName = tx.sender 
          ? [tx.sender.last_name, tx.sender.first_name, tx.sender.middle_name].filter(Boolean).join(' ') || tx.sender.username || `ID #${tx.sender_id}`
          : `ID #${tx.sender_id}`;
          
        const receiverName = tx.receiver 
          ? [tx.receiver.first_name, tx.receiver.last_name].filter(Boolean).join(' ') || tx.receiver.username || `ID #${tx.receiver_id}`
          : `ID #${tx.receiver_id}`;

        const formattedAmount = (tx.amount || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2 });

        return `
          <tr>
            <td style="text-align: center;">
              <input type="checkbox" class="tx-checkbox" value="${tx.id}" onchange="updateSelectedCount()">
            </td>
            <td class="badge-id">#${tx.id}</td>
            <td>${tx.created_at || '-'}</td>
            <td><strong>${clientName}</strong></td>
            <td>${receiverName}</td>
            <td style="font-weight: 700;">${formattedAmount} UZS</td>
          </tr>
        `;
      }).join('');
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.tx-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const selected = document.querySelectorAll('.tx-checkbox:checked');
      document.getElementById('selected-count').textContent = `Tanlandi: ${selected.length}`;
    }

    function printSelectedReport() {
      const checkedBoxes = Array.from(document.querySelectorAll('.tx-checkbox:checked'));
      let selectedTransactions = [];

      if (checkedBoxes.length === 0) {
        selectedTransactions = rawTransactions;
      } else {
        const selectedIds = checkedBoxes.map(cb => cb.value);
        selectedTransactions = rawTransactions.filter(tx => selectedIds.includes(String(tx.id)));
      }

      if (selectedTransactions.length === 0) {
        alert('Chop etish uchun ma\'lumot yo\'q.');
        return;
      }

      const totalAmount = selectedTransactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);
      const formattedTotal = totalAmount.toLocaleString('ru-RU', { minimumFractionDigits: 2 });
      const now = new Date().toLocaleString();

      const tableRows = selectedTransactions.map((tx, idx) => {
        const clientName = tx.sender 
          ? [tx.sender.last_name, tx.sender.first_name, tx.sender.middle_name].filter(Boolean).join(' ') || tx.sender.username || `ID #${tx.sender_id}`
          : `ID #${tx.sender_id}`;
          
        const receiverName = tx.receiver 
          ? [tx.receiver.first_name, tx.receiver.last_name].filter(Boolean).join(' ') || tx.receiver.username || `ID #${tx.receiver_id}`
          : `ID #${tx.receiver_id}`;

        const formattedAmount = (tx.amount || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2 });

        return `
          <tr>
            <td style="text-align: center;">${idx + 1}</td>
            <td style="font-weight: bold; font-family: monospace;">#${tx.id}</td>
            <td>${tx.created_at || '-'}</td>
            <td>${clientName}</td>
            <td>${receiverName}</td>
            <td style="text-align: right; font-weight: bold;">${formattedAmount} UZS</td>
          </tr>
        `;
      }).join('');

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>Bindin Hisoboti</title>
            <link rel="icon" type="image/x-icon" href="static/favicon.ico">
            <style>
              @page {
                size: A4 portrait;
                margin: 12mm;
              }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                background: #fff;
                color: #0f172a;
                margin: 0;
                padding: 10px;
              }
              .report-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                border-bottom: 2px solid #0f172a;
                padding-bottom: 10px;
                margin-bottom: 16px;
              }
              .brand-box {
                display: flex;
                align-items: center;
                gap: 10px;
              }
              .brand-box img {
                width: 28px;
                height: 28px;
              }
              .report-title {
                font-size: 18px;
                font-weight: 800;
                text-transform: uppercase;
                color: #0f172a;
              }
              .report-meta {
                font-size: 11px;
                color: #475569;
                text-align: right;
              }
              .stats-cards {
                display: flex;
                gap: 15px;
                margin-bottom: 20px;
              }
              .stat-box {
                flex: 1;
                background: #f8fafc;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                padding: 10px 14px;
              }
              .stat-label {
                font-size: 10px;
                text-transform: uppercase;
                color: #64748b;
                font-weight: 700;
              }
              .stat-value {
                font-size: 16px;
                font-weight: 800;
                color: #0f172a;
                margin-top: 2px;
              }
              table.print-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 20px;
              }
              table.print-table th {
                background: #f1f5f9;
                color: #334155;
                font-size: 11px;
                text-transform: uppercase;
                padding: 8px 10px;
                border: 1px solid #cbd5e1;
                text-align: left;
              }
              table.print-table td {
                padding: 8px 10px;
                border: 1px solid #cbd5e1;
                font-size: 12px;
              }
              table.print-table tr:nth-child(even) {
                background: #f8fafc;
              }
              .total-row td {
                background: #e2e8f0 !important;
                font-weight: 800;
                font-size: 13px;
              }
              .footer-note {
                font-size: 10px;
                color: #94a3b8;
                text-align: center;
                margin-top: 20px;
                border-top: 1px solid #e2e8f0;
                padding-top: 8px;
              }
            </style>
          </head>
          <body>
            <div class="report-header">
              <div>
                <div class="brand-box">
                  <img src="static/favicon.ico" alt="Bindin Logo">
                  <div class="report-title">BINDIN TRANSAKSIYALAR HISOBOTI</div>
                </div>
                <div style="font-size: 12px; color: #2563eb; font-weight: 600; margin-top: 4px;">Kassa va Moliya Tizimi</div>
              </div>
              <div class="report-meta">
                <div><strong>Vaqt:</strong> ${now}</div>
                <div><strong>Tranzaksiyalar:</strong> ${selectedTransactions.length} ta</div>
              </div>
            </div>

            <div class="stats-cards">
              <div class="stat-box">
                <div class="stat-label">Jami Operatsiyalar</div>
                <div class="stat-value">${selectedTransactions.length} ta</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Jami Aylanma Summasi</div>
                <div class="stat-value" style="color: #2563eb;">${formattedTotal} UZS</div>
              </div>
            </div>

            <table class="print-table">
              <thead>
                <tr>
                  <th style="width: 35px; text-align: center;">№</th>
                  <th style="width: 80px;">ID</th>
                  <th style="width: 130px;">Sana</th>
                  <th>To'lovchi (Mijoz)</th>
                  <th>Qabul qiluvchi</th>
                  <th style="text-align: right; width: 140px;">Summa</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows}
                <tr class="total-row">
                  <td colspan="5" style="text-align: right;">JAMI SUMMA:</td>
                  <td style="text-align: right;">${formattedTotal} UZS</td>
                </tr>
              </tbody>
            </table>

            <div class="footer-note">
              Ushbu hisobot Bindin avtomatlashtirilgan kassa tizimi tomonidan yaratildi.
            </div>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      fetchTransactions();
    }

    function logout() {
      localStorage.removeItem('access_token');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    if (localStorage.getItem('access_token')) {
      showDashboard();
    }
  </script>
</body>
</html>
