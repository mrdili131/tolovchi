<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bindin — Kassa Hisoboti</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/bindin-icon-32.png">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    .control-panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.25rem;
    }
    .checkbox-label { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
    .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }
    .badge-id { font-family: ui-monospace, monospace; font-weight: 700; color: var(--primary); }
  </style>
</head>
<body>

  <header class="topbar">
      <div class="topbar-inner">
          <a href="/admin" class="topbar-brand">
              <img src="/static/bindin-icon-64.png" alt="Bindin">
              Bindin Admin
          </a>
          <nav class="topbar-nav">
              <a href="/admin">Umumiy</a>
              <a href="/admin/transactions">Tranzaksiyalar</a>
              <a href="/printables">Kassa hisoboti</a>
          </nav>
          <div class="topbar-actions">
              <span class="badge">ADMIN</span>
              <button onclick="logout()" class="icon-btn" title="Chiqish" aria-label="Chiqish">
                  <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
              </button>
          </div>
      </div>
  </header>

  <main class="page">
    <div class="page-head">
        <div>
            <h1>Kassa hisoboti</h1>
            <p>Tekshiruvlar uchun tranzaksiyalarni tanlab yoki to'liq chop eting</p>
        </div>
    </div>

    <div class="control-panel">
      <label class="checkbox-label">
        <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)">
        Barchasini tanlash
      </label>
      <div style="display: flex; align-items: center; gap: 15px;">
        <span id="selected-count" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-soft);">Tanlandi: 0</span>
        <button onclick="printSelectedReport()" class="btn btn-primary" style="width:auto;">📄 Hisobotni chop etish</button>
      </div>
    </div>

    <div id="status-message" style="margin-bottom: 12px; font-size: 0.85rem; color: var(--ink-soft);">
      Yuklanmoqda...
    </div>

    <div class="card" style="padding:0;">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px; text-align: center;">#</th>
              <th>Tranzaksiya №</th>
              <th>Sana</th>
              <th>To'lovchi (Mijoz)</th>
              <th>Qabul qiluvchi (Servis)</th>
              <th>Summa</th>
              <th>Komissiya</th>
              <th>Holat</th>
            </tr>
          </thead>
          <tbody id="transactions-list-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="globalLoader" class="loading-overlay hidden">
      <div class="spinner"></div>
  </div>

  <script src="/static/js/dashboard.js"></script>
  <script>
    requireRole(['admin']);

    let rawTransactions = [];

    // Admin-only endpoint, and it's paginated — pull every page so the report
    // covers the platform's full transaction history, not just one page.
    async function fetchAllTransactions() {
      const statusMsg = document.getElementById('status-message');
      let page = 1;
      let all = [];

      try {
        while (true) {
          const res = await apiFetch(`/admin/transactions?page=${page}&page_size=100`);
          if (!res.ok) throw new Error("Tranzaksiyalarni yuklashda xatolik");
          const data = await res.json();
          all = all.concat(data.items);
          if (!data.has_next) break;
          page += 1;
        }

        rawTransactions = all;

        if (rawTransactions.length === 0) {
          statusMsg.textContent = 'Tranzaksiyalar topilmadi.';
          return;
        }

        statusMsg.textContent = `Jami ${rawTransactions.length} ta tranzaksiya yuklandi.`;
        renderTable(rawTransactions);
      } catch (err) {
        statusMsg.textContent = 'Xatolik: ' + err.message;
      }
    }

    function renderTable(transactions) {
      const tbody = document.getElementById('transactions-list-body');
      tbody.innerHTML = transactions.map(tx => {
        const clientName = formatUserFullName(tx.sender);
        const receiverName = formatUserFullName(tx.receiver);
        const formattedAmount = (tx.amount || 0).toLocaleString('ru-RU');
        const formattedFee = (tx.fee_amount || 0).toLocaleString('ru-RU');

        return `
          <tr>
            <td style="text-align: center;">
              <input type="checkbox" class="tx-checkbox" value="${tx.id}" onchange="updateSelectedCount()">
            </td>
            <td class="badge-id">#${tx.id}</td>
            <td>${tx.created_at || '-'}</td>
            <td><strong>${clientName}</strong></td>
            <td>${receiverName}</td>
            <td style="font-weight: 700;">${formattedAmount} UZS</td>
            <td>${formattedFee} UZS</td>
            <td><span class="status-tag ${tx.status}">${tx.status}</span></td>
          </tr>
        `;
      }).join('');
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.tx-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const selected = document.querySelectorAll('.tx-checkbox:checked');
      document.getElementById('selected-count').textContent = `Tanlandi: ${selected.length}`;
    }

    function printSelectedReport() {
      const checkedBoxes = Array.from(document.querySelectorAll('.tx-checkbox:checked'));
      let selectedTransactions = checkedBoxes.length === 0
        ? rawTransactions
        : rawTransactions.filter(tx => checkedBoxes.map(cb => cb.value).includes(String(tx.id)));

      if (selectedTransactions.length === 0) {
        showAlert("Chop etish uchun ma'lumot yo'q.", "error");
        return;
      }

      const totalAmount = selectedTransactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);
      const totalFee = selectedTransactions.reduce((sum, tx) => sum + (tx.fee_amount || 0), 0);
      const formattedTotal = totalAmount.toLocaleString('ru-RU');
      const formattedFeeTotal = totalFee.toLocaleString('ru-RU');
      const now = new Date().toLocaleString('ru-RU');

      const tableRows = selectedTransactions.map((tx, idx) => {
        const clientName = formatUserFullName(tx.sender);
        const receiverName = formatUserFullName(tx.receiver);
        const formattedAmount = (tx.amount || 0).toLocaleString('ru-RU');
        const formattedFee = (tx.fee_amount || 0).toLocaleString('ru-RU');

        return `
          <tr>
            <td style="text-align: center;">${idx + 1}</td>
            <td style="font-weight: bold; font-family: monospace;">#${tx.id}</td>
            <td>${tx.created_at || '-'}</td>
            <td>${clientName}</td>
            <td>${receiverName}</td>
            <td style="text-align: right; font-weight: bold;">${formattedAmount} UZS</td>
            <td style="text-align: right;">${formattedFee} UZS</td>
            <td>${tx.status}</td>
          </tr>
        `;
      }).join('');

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>Bindin Hisoboti</title>
            <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
            <style>
              @page { size: A4 landscape; margin: 12mm; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #fff; color: #0f172a; margin: 0; padding: 10px; }
              .report-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 16px; }
              .brand-box { display: flex; align-items: center; gap: 10px; }
              .brand-box img { width: 28px; height: 28px; }
              .report-title { font-size: 18px; font-weight: 800; text-transform: uppercase; color: #0f172a; }
              .report-meta { font-size: 11px; color: #475569; text-align: right; }
              .stats-cards { display: flex; gap: 15px; margin-bottom: 20px; }
              .stat-box { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px 14px; }
              .stat-label { font-size: 10px; text-transform: uppercase; color: #64748b; font-weight: 700; }
              .stat-value { font-size: 16px; font-weight: 800; color: #0f172a; margin-top: 2px; }
              table.print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
              table.print-table th { background: #f1f5f9; color: #334155; font-size: 11px; text-transform: uppercase; padding: 8px 10px; border: 1px solid #cbd5e1; text-align: left; }
              table.print-table td { padding: 8px 10px; border: 1px solid #cbd5e1; font-size: 12px; }
              table.print-table tr:nth-child(even) { background: #f8fafc; }
              .total-row td { background: #e2e8f0 !important; font-weight: 800; font-size: 13px; }
              .footer-note { font-size: 10px; color: #94a3b8; text-align: center; margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
            </style>
          </head>
          <body>
            <div class="report-header">
              <div>
                <div class="brand-box">
                  <img src="/static/bindin-icon-64.png" alt="Bindin Logo">
                  <div class="report-title">BINDIN TRANSAKSIYALAR HISOBOTI</div>
                </div>
                <div style="font-size: 12px; color: #2563eb; font-weight: 600; margin-top: 4px;">Kassa va Moliya Tizimi — Admin hisoboti</div>
              </div>
              <div class="report-meta">
                <div><strong>Vaqt:</strong> ${now}</div>
                <div><strong>Tranzaksiyalar:</strong> ${selectedTransactions.length} ta</div>
              </div>
            </div>

            <div class="stats-cards">
              <div class="stat-box">
                <div class="stat-label">Jami Operatsiyalar</div>
                <div class="stat-value">${selectedTransactions.length} ta</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Jami Aylanma Summasi</div>
                <div class="stat-value" style="color: #2563eb;">${formattedTotal} UZS</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Jami Komissiya (InPay)</div>
                <div class="stat-value" style="color: #b45309;">${formattedFeeTotal} UZS</div>
              </div>
            </div>

            <table class="print-table">
              <thead>
                <tr>
                  <th style="width: 30px; text-align: center;">№</th>
                  <th style="width: 70px;">ID</th>
                  <th style="width: 120px;">Sana</th>
                  <th>To'lovchi (Mijoz)</th>
                  <th>Qabul qiluvchi (Servis)</th>
                  <th style="text-align: right; width: 120px;">Summa</th>
                  <th style="text-align: right; width: 100px;">Komissiya</th>
                  <th style="width: 90px;">Holat</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows}
                <tr class="total-row">
                  <td colspan="5" style="text-align: right;">JAMI SUMMA:</td>
                  <td style="text-align: right;">${formattedTotal} UZS</td>
                  <td style="text-align: right;">${formattedFeeTotal} UZS</td>
                  <td></td>
                </tr>
              </tbody>
            </table>

            <div class="footer-note">
              Ushbu hisobot Bindin avtomatlashtirilgan kassa tizimi tomonidan yaratildi.
            </div>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    fetchAllTransactions();
  </script>
</body>
</html>
