<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Bindin — Bildirishnomalar</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#1447E6">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/bindin-icon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .notif-item { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0.9rem 1rem; margin-bottom: 0.7rem; }
        .notif-item.unread { border-left: 3px solid var(--primary); background: var(--primary-light); }
        .notif-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .notif-message { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.5; }
        .notif-meta { font-size: 0.74rem; color: var(--ink-faint); margin-top: 0.4rem; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="#" id="brandLink" class="topbar-brand">
                <img src="/static/bindin-icon-64.png" alt="Bindin">
                Bindin
            </a>
            <nav class="topbar-nav">
                <a href="#" id="backLink">Orqaga</a>
            </nav>
            <div class="topbar-actions">
                <span id="roleBadge" class="badge">USER</span>
                <button onclick="logout()" class="icon-btn" title="Chiqish" aria-label="Chiqish">
                    <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                </button>
                <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menyu">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
                </button>
            </div>
        </div>
        <div id="mobileNavPanel" class="mobile-nav-panel">
            <a href="#" id="backLinkMobile">Orqaga</a>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <div>
                <h1>Bildirishnomalar</h1>
                <p>Tizim va admin tomonidan yuborilgan xabarlar</p>
            </div>
        </div>

        <div class="card">
            <div id="notifContainer" class="stack">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>
            <div id="notifPagination"></div>
        </div>
    </main>

    <div id="govModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="govModalTitle">Tizim bildirishnomasi</h3>
            <div id="govModalBody" class="gov-alert-body">--</div>
            <button class="btn btn-primary btn-block" onclick="closeGovAlert()">Tushundim</button>
        </div>
    </div>

    <div id="globalLoader" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="/static/js/dashboard.js"></script>
    <script>
        requireRole(['user', 'service', 'admin']);

        const role = localStorage.getItem("role");
        const homeUrl = role === 'admin' ? '/admin' : '/dashboard';
        document.getElementById("brandLink").href = homeUrl;
        document.getElementById("backLink").href = homeUrl;
        document.getElementById("backLinkMobile").href = homeUrl;

        let notifPage = 1;

        async function loadNotifications(page = 1) {
            notifPage = page;
            const container = document.getElementById("notifContainer");
            container.innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div>';

            const res = await apiFetch(`/notifications/?page=${page}&page_size=15`);
            if (!res.ok) { container.innerHTML = emptyState("Ma'lumotlarni yuklab bo'lmadi."); return; }

            const paginated = await res.json();
            renderPagination(document.getElementById("notifPagination"), paginated, loadNotifications);

            if (paginated.items.length === 0) {
                container.innerHTML = emptyState("Hozircha bildirishnomalar mavjud emas.");
                return;
            }

            container.innerHTML = paginated.items.map(n => `
                <div class="notif-item ${n.is_read ? '' : 'unread'}" data-id="${n.id}" ${n.is_read ? '' : `onclick="markRead(${n.id}, this)"`}>
                    <div class="notif-title">${n.title}</div>
                    <div class="notif-message">${n.message}</div>
                    <div class="notif-meta">${n.created_at ? new Date(n.created_at).toLocaleString('ru-RU') : ''}${n.is_read ? '' : ' · o\'qilmagan'}</div>
                </div>
            `).join('');

            updateNotifBadge();
        }

        async function markRead(id, el) {
            await apiFetch(`/notifications/${id}/read`, { method: "POST" });
            el.classList.remove('unread');
            el.removeAttribute('onclick');
            updateNotifBadge();
        }

        loadNotifications();
    </script>
</body>
</html>
