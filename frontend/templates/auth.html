<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
    <title>Bindin — Kirish yoki ro'yxatdan o'tish</title>
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#1447E6">
    <link rel="icon" type="image/png" sizes="32x32" href="static/bindin-icon-32.png">
    <link rel="apple-touch-icon" href="static/bindin-icon-180.png">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1447E6;
            --primary-dark: #0B2F9E;
            --violet: #7C5CFC;
            --ink: #0B1220;
            --ink-soft: #4B5567;
            --ink-faint: #8891A3;
            --line: #E6E9F1;
            --bg: #F6F8FC;
            --surface: #FFFFFF;
            --success: #10B981;
            --success-bg: #ECFDF5;
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            padding: 1.1rem 1.4rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--ink-soft);
        }
        .back-link svg { width: 16px; height: 16px; fill: currentColor; }
        .back-link:hover { color: var(--primary); }

        .auth-shell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.2rem 2.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 2rem 1.8rem;
            box-shadow: 0 30px 60px -30px rgba(11,18,32,0.22);
        }

        .auth-logo {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .auth-logo img { width: 100%; height: 100%; object-fit: contain; }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--ink-soft);
            font-size: 0.86rem;
            margin-top: 0.3rem;
            margin-bottom: 1.5rem;
        }

        .auth-switch {
            display: flex;
            background: var(--bg);
            border-radius: 999px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        .auth-switch button {
            flex: 1;
            height: 40px;
            border-radius: 999px;
            border: none;
            background: transparent;
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }
        .auth-switch button.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(11,18,32,0.08);
        }

        .form-group { margin-bottom: 0.9rem; }

        label {
            display: block;
            font-size: 0.78rem;
            margin-bottom: 0.35rem;
            color: var(--ink-soft);
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 0.9rem;
            border: 1.5px solid var(--line);
            border-radius: 11px;
            font-size: 0.95rem;
            background: var(--surface);
            color: var(--ink);
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(20,71,230,0.12);
        }

        button.btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--violet));
            color: #fff;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }
        button.btn:active { opacity: 0.9; }
        button.btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .offer-agreement {
            display: flex;
            align-items: flex-start;
            gap: 0.55rem;
            margin-bottom: 1.1rem;
        }
        .offer-agreement input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            margin-top: 2px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .offer-agreement label {
            margin: 0;
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--ink);
            line-height: 1.4;
            cursor: pointer;
        }
        .offer-agreement a { color: var(--primary); font-weight: 700; text-decoration: underline; }

        .hidden { display: none !important; }

        /* ---------- Alert / toast ---------- */
        .toast {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            max-width: 92%;
            padding: 0.8rem 1.1rem;
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 600;
            box-shadow: 0 12px 28px -12px rgba(11,18,32,0.3);
            z-index: 3000;
            animation: bindin-toast-in 0.18s ease;
        }
        .toast.success { background: var(--success-bg); color: #065F46; border: 1px solid #A7F3D0; }
        .toast.error { background: var(--danger-bg); color: #991B1B; border: 1px solid #FECACA; }
        @keyframes bindin-toast-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11,18,32,0.35);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 38px; height: 38px;
            border: 4px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: bindin-spin 0.8s linear infinite;
        }
        .btn-spinner {
            width: 17px; height: 17px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: bindin-spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes bindin-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Bosh sahifaga qaytish
        </a>
    </div>

    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="static/bindin-icon-64.png" alt="Bindin">
            </div>
            <h1 id="authTitle">Xush kelibsiz</h1>
            <p class="auth-subtitle" id="authSubtitle">Hisobingizga kiring va davom eting</p>

            <div class="auth-switch">
                <button type="button" id="switchLoginBtn" class="active" onclick="setAuthMode(false)">Kirish</button>
                <button type="button" id="switchRegisterBtn" onclick="setAuthMode(true)">Ro'yxatdan o'tish</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
                <div id="registerNameFields" class="hidden">
                    <div class="form-group">
                        <label>Ism</label>
                        <input type="text" id="firstName" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label>Familiya</label>
                        <input type="text" id="lastName" autocomplete="family-name">
                    </div>
                    <div class="form-group">
                        <label>Sharif (otasining ismi)</label>
                        <input type="text" id="middleName" autocomplete="additional-name">
                    </div>
                </div>
                <div class="form-group">
                    <label>Foydalanuvchi nomi</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Parol</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <div id="confirmPasswordGroup" class="form-group hidden">
                    <label>Parolni tasdiqlash</label>
                    <input type="password" id="password_confirm" autocomplete="new-password">
                </div>
                <div id="offerAgreement" class="offer-agreement hidden">
                    <input type="checkbox" id="offerAccepted" onchange="updateAuthSubmitState()">
                    <label for="offerAccepted">
                        Men <a href="/oferta" target="_blank" rel="noopener">ommaviy oferta</a> shartlari bilan tanishdim va roziman
                    </label>
                </div>
                <button type="submit" class="btn" id="authSubmitBtn">Kirish</button>
            </form>
        </div>
    </div>

    <div id="globalLoader" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script>
        const API_BASE = "https://bindin.uz/api";
        let isRegisterMode = false;

        function showLoader() { document.getElementById("globalLoader").classList.remove("hidden"); }
        function hideLoader() { document.getElementById("globalLoader").classList.add("hidden"); }

        function setButtonLoading(button, loadingText) {
            if (!button) return () => {};
            const originalHTML = button.innerHTML;
            const originalDisabled = button.disabled;
            button.disabled = true;
            button.innerHTML = `<span class="btn-spinner"></span>${loadingText ? `<span>${loadingText}</span>` : ''}`;
            return () => {
                button.innerHTML = originalHTML;
                button.disabled = originalDisabled;
            };
        }

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4200);
        }

        function updateAuthSubmitState() {
            const submitBtn = document.getElementById("authSubmitBtn");
            if (!submitBtn) return;
            submitBtn.disabled = isRegisterMode ? !document.getElementById("offerAccepted").checked : false;
        }

        function setAuthMode(registerMode) {
            isRegisterMode = registerMode;
            document.getElementById("switchLoginBtn").classList.toggle("active", !isRegisterMode);
            document.getElementById("switchRegisterBtn").classList.toggle("active", isRegisterMode);
            document.getElementById("authTitle").innerText = isRegisterMode ? "Hisob yarating" : "Xush kelibsiz";
            document.getElementById("authSubtitle").innerText = isRegisterMode ? "Bir necha soniyada ro'yxatdan o'ting" : "Hisobingizga kiring va davom eting";
            document.getElementById("authSubmitBtn").innerText = isRegisterMode ? "Hisob yaratish" : "Kirish";
            document.getElementById("confirmPasswordGroup").classList.toggle("hidden", !isRegisterMode);
            document.getElementById("registerNameFields").classList.toggle("hidden", !isRegisterMode);
            document.getElementById("offerAgreement").classList.toggle("hidden", !isRegisterMode);
            document.getElementById("firstName").required = isRegisterMode;
            document.getElementById("lastName").required = isRegisterMode;
            document.getElementById("middleName").required = isRegisterMode;
            document.getElementById("offerAccepted").checked = false;
            updateAuthSubmitState();

            const url = new URL(window.location);
            url.searchParams.set('mode', isRegisterMode ? 'register' : 'login');
            window.history.replaceState({}, '', url);
        }

        async function extractErrorMessage(res) {
            try {
                const data = await res.json();
                if (data.detail && Array.isArray(data.detail)) {
                    return data.detail.map(e => e.msg).join(', ');
                }
                return data.detail || "Xatolik yuz berdi.";
            } catch {
                return "Noma'lum xatolik yuz berdi.";
            }
        }

        async function handleAuth(e) {
            e.preventDefault();

            if (isRegisterMode && !document.getElementById("offerAccepted").checked) {
                showToast("Davom etish uchun ommaviy oferta shartlariga rozilik bildiring.", "error");
                return;
            }

            const submitBtn = document.getElementById("authSubmitBtn");
            const restoreBtn = setButtonLoading(submitBtn, isRegisterMode ? "Yaratilmoqda..." : "Kirilmoqda...");

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                if (isRegisterMode) {
                    const password_confirm = document.getElementById("password_confirm").value;
                    const first_name = document.getElementById("firstName").value;
                    const last_name = document.getElementById("lastName").value;
                    const middle_name = document.getElementById("middleName").value;
                    const offer_accepted = document.getElementById("offerAccepted").checked;

                    showLoader();
                    const res = await fetch(`${API_BASE}/auth/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password, password_confirm, first_name, last_name, middle_name, offer_accepted })
                    }).finally(hideLoader);

                    if (res.ok) {
                        showToast("Ro'yxatdan o'tish muvaffaqiyatli yakunlandi. Endi tizimga kiring.", "success");
                        setAuthMode(false);
                    } else {
                        const err = await extractErrorMessage(res);
                        showToast(`Xatolik: ${err}`, "error");
                    }
                } else {
                    const formData = new URLSearchParams();
                    formData.append("username", username);
                    formData.append("password", password);

                    showLoader();
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData
                    }).finally(hideLoader);

                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem("token", data.access_token);
                        localStorage.setItem("role", data.role);
                        window.location.href = "/dashboard";
                    } else {
                        const err = await extractErrorMessage(res);
                        showToast(`Kirishda xatolik: ${err}`, "error");
                    }
                }
            } finally {
                restoreBtn();
            }
        }

        (function init() {
            try {
                if (localStorage.getItem("token")) {
                    window.location.href = "/dashboard";
                    return;
                }
            } catch (e) {}

            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'register') {
                setAuthMode(true);
            }
        })();
    </script>
</body>
</html>
