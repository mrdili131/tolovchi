<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Bindin — Arizalar</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#1447E6">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/bindin-icon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="/dashboard" class="topbar-brand">
                <img src="/static/bindin-icon-64.png" alt="Bindin">
                Bindin
            </a>
            <nav class="topbar-nav">
                <a href="/dashboard">Asosiy</a>
                <a href="/dashboard/cards" data-role="user-only">Kartalar</a>
                <a href="/dashboard/applications">Arizalar</a>
                <a href="/dashboard/transactions">Tranzaksiyalar</a>
            </nav>
            <div class="topbar-actions">
                <span id="roleBadge" class="badge">USER</span>
                <a href="/info" class="icon-btn" title="Yordam" aria-label="Yordam">
                    <svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
                </a>
                <button onclick="logout()" class="icon-btn" title="Chiqish" aria-label="Chiqish">
                    <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                </button>
                <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menyu">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
                </button>
            </div>
        </div>
        <div id="mobileNavPanel" class="mobile-nav-panel">
            <a href="/dashboard">Asosiy</a>
            <a href="/dashboard/cards" data-role="user-only">Kartalar</a>
            <a href="/dashboard/applications">Arizalar</a>
            <a href="/dashboard/transactions">Tranzaksiyalar</a>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <div>
                <h1>Arizalar</h1>
                <p id="pageSub">Obuna arizalaringizni shu yerdan boshqaring</p>
            </div>
            <button id="scanBtn" onclick="openQrScanner()" class="btn btn-primary hidden">
                <svg style="width:18px; height:18px; fill:currentColor;" viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-14h-4V3h4c1.1 0 2 .9 2 2v4h-2V5zM7 7h4v4H7V7zm10 0h-4v4h4V7zM7 17h4v-4H7v4zm5-5h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2zm4 0h2v2h-2v-2zm0-4h2v2h-2v-2z"/></svg>
                QR skanerlash
            </button>
        </div>

        <div class="stack">
            <div id="serviceAppSection" class="card hidden">
                <h2>Yangi ariza yaratish</h2>
                <form onsubmit="handleCreateApp(event)">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Ariza nomi</label>
                            <input type="text" id="appName" required placeholder="Masalan: Netflix obunasi">
                        </div>
                        <div class="form-group">
                            <label>Tavsif</label>
                            <input type="text" id="appDesc" required placeholder="Qisqacha izoh">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Summa (UZS)</label>
                            <input type="number" id="appAmount" min="1000" required>
                        </div>
                        <div class="form-group">
                            <label>Kuni (1-31)</label>
                            <input type="number" id="appPayDay" min="1" max="31" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Davriyligi</label>
                        <select id="appFrequency">
                            <option value="monthly">Har oy</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="createAppBtn">Arizani joylashtirish</button>
                </form>
            </div>

            <div class="card">
                <h2>Arizalar ro'yxati</h2>
                <div id="applicationsContainer" class="app-list">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="qrModal" class="modal hidden">
        <div class="modal-content">
            <h3>QR koddagi havolani skanerlang</h3>
            <div id="qr-reader-container"><div id="qr-reader"></div></div>
            <button onclick="closeQrScanner()" class="btn btn-secondary btn-block">Kamerani yopish</button>
        </div>
    </div>

    <div id="qrDisplayModal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <h3>Ariza QR kodi</h3>
            <p id="qrModalAppDesc" style="font-size:0.85rem; color:var(--ink-soft); margin-bottom:1rem;">--</p>
            <div id="qrDisplayContainer"></div>
            <button onclick="closeQrDisplayModal()" class="btn btn-secondary btn-block">Yopish</button>
        </div>
    </div>

    <div id="govModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="govModalTitle">Tizim bildirishnomasi</h3>
            <div id="govModalBody" class="gov-alert-body">--</div>
            <button class="btn btn-primary btn-block" onclick="closeGovAlert()">Tushundim</button>
        </div>
    </div>

    <div id="globalLoader" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="/static/js/dashboard.js"></script>
    <script>
        let html5QrCodeEngine = null;

        async function handleCreateApp(e) {
            e.preventDefault();
            const restore = setButtonLoading(document.getElementById("createAppBtn"), "Yaratilmoqda...");
            try {
                const payload = {
                    name: document.getElementById("appName").value,
                    description: document.getElementById("appDesc").value,
                    amount: parseInt(document.getElementById("appAmount").value),
                    frequency: document.getElementById("appFrequency").value,
                    pay_day: parseInt(document.getElementById("appPayDay").value)
                };

                const res = await apiFetch("/application/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showAlert("Ariza yaratildi.", "success");
                    document.getElementById("appName").value = '';
                    document.getElementById("appDesc").value = '';
                    document.getElementById("appAmount").value = '';
                    document.getElementById("appPayDay").value = '';
                    loadApplications();
                } else {
                    const err = await extractErrorMessage(res);
                    showAlert(`Xatolik: ${err}`, "error");
                }
            } finally {
                restore();
            }
        }

        async function loadApplications() {
            const role = localStorage.getItem("role");
            const container = document.getElementById("applicationsContainer");
            container.innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div>';

            const res = await apiFetch("/application/");
            if (res.ok) {
                const apps = await res.json();

                if (!apps || apps.length === 0) {
                    container.innerHTML = emptyState('Hozircha arizalar mavjud emas.');
                    return;
                }

                container.innerHTML = apps.map(a => {
                    const hasPayer = !!a.payer;
                    const canShowQr = role === 'service' && (!a.is_active && !hasPayer);
                    const balanceInfo = role === 'service' ? ` · Balans: ${a.balance || 0} UZS` : '';

                    return `
                        <div class="list-item">
                            <div class="list-item-main">
                                <div class="list-item-icon">${appIconSvg()}</div>
                                <div class="list-item-info">
                                    <span class="list-item-title">${a.name || 'Nomsiz'} <small style="color:var(--ink-soft); font-weight:500;">#${a.id}</small></span>
                                    <span class="list-item-sub">Sana: ${a.pay_day} (${a.frequency})${balanceInfo}</span>
                                </div>
                            </div>
                            <div class="list-item-side">
                                <span class="status-tag ${a.is_active ? 'active' : 'inactive'}">${a.is_active ? 'Faol' : 'Nofaol'}</span>
                                ${canShowQr ? `<button onclick="generateQrModal('${a.id}', '${encodeURIComponent(a.name || a.description)}')" class="btn btn-secondary btn-sm">QR</button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = emptyState("Ma'lumotlarni yuklab bo'lmadi.");
            }
        }

        function generateQrModal(appId, appDesc) {
            const targetUrl = `${API_BASE}/application/link/${appId}`;
            const container = document.getElementById("qrDisplayContainer");
            container.innerHTML = "";
            document.getElementById("qrModalAppDesc").innerText = `Ariza #${appId}: ${decodeURIComponent(appDesc)}`;

            new QRCode(container, {
                text: targetUrl,
                width: 200,
                height: 200,
                colorDark: "#1447E6",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById("qrDisplayModal").classList.remove("hidden");
        }

        function closeQrDisplayModal() { document.getElementById("qrDisplayModal").classList.add("hidden"); }

        async function openQrScanner() {
            document.getElementById("qrModal").classList.remove("hidden");
            if (html5QrCodeEngine) await closeQrScanner();

            try {
                html5QrCodeEngine = new Html5Qrcode("qr-reader");
                const qrConfig = { fps: 10, qrbox: { width: 200, height: 200 } };
                const cameras = await Html5Qrcode.getCameras();

                if (cameras && cameras.length > 0) {
                    await html5QrCodeEngine.start(cameras[cameras.length - 1].id, qrConfig, onScanSuccess, onScanFailure);
                } else {
                    await html5QrCodeEngine.start({ facingMode: "environment" }, qrConfig, onScanSuccess, onScanFailure);
                }
            } catch (err) {
                showAlert("Kamerani ishga tushirib bo'lmadi.", "error");
                closeQrScanner();
            }
        }

        async function closeQrScanner() {
            if (html5QrCodeEngine) {
                try { await html5QrCodeEngine.stop(); html5QrCodeEngine.clear(); } catch (e) {}
                html5QrCodeEngine = null;
            }
            document.getElementById("qrModal").classList.add("hidden");
        }

        async function onScanSuccess(decodedText) {
            await closeQrScanner();
            let targetUrl = decodedText;
            if (!isNaN(decodedText)) targetUrl = `${API_BASE}/application/link/${decodedText}`;

            showLoader();
            try {
                const res = await fetch(targetUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`,
                        "Content-Type": "application/json"
                    }
                });

                if (res.ok) {
                    const data = await res.json();
                    showAlert(`Ariza ulandi!\nHolati: ${data.status ? 'Muvaffaqiyatli' : 'Muvaffaqiyatsiz'}\nTafsilot: ${data.detail}`, "success");
                    loadApplications();
                } else {
                    const err = await extractErrorMessage(res);
                    showAlert(`QR ulashda xatolik: ${err}`, "error");
                }
            } catch (err) {
                showAlert("QR havolani bajarishda xatolik.", "error");
            } finally {
                hideLoader();
            }
        }

        function onScanFailure(error) {}

        (function init() {
            const role = localStorage.getItem("role");
            if (role === 'service') {
                document.getElementById("serviceAppSection").classList.remove("hidden");
                document.getElementById("pageSub").innerText = "Yangi obuna arizalari yaratish va mijozlarni kuzatish";
            } else {
                document.getElementById("scanBtn").classList.remove("hidden");
                document.getElementById("pageSub").innerText = "QR kod orqali xizmatlarga obuna bo'ling";
            }
            loadApplications();
        })();
    </script>
</body>
</html>
