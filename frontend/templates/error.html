<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>{{code}} — {{title}} | Bindin</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#1447E6">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/bindin-icon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1447E6;
            --violet: #7C5CFC;
            --ink: #0B1220;
            --ink-soft: #4B5567;
            --line: #E6E9F1;
            --bg: #F6F8FC;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        header { padding: 1.2rem 24px; }
        .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.1rem; }
        .brand img { width: 30px; height: 30px; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 16px 4rem; text-align: center; }
        .box { max-width: 480px; }
        .code {
            font-size: 6.5rem; font-weight: 800; line-height: 1; letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--primary), var(--violet));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 0.6rem; }
        p { color: var(--ink-soft); margin-bottom: 2rem; line-height: 1.6; }
        .actions { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.8rem 1.4rem; border-radius: 11px;
            font-weight: 700; font-size: 0.92rem; font-family: inherit;
            border: none; cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--violet)); color: #fff; box-shadow: 0 12px 26px -12px rgba(20,71,230,0.65); }
        .btn-outline { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        @media (max-width: 480px) { .code { font-size: 5rem; } .actions .btn { flex: 1; } }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand"><img src="/static/bindin-icon-64.png" alt="Bindin logotipi"> Bindin</a>
    </header>
    <main>
        <div class="box">
            <div class="code">{{code}}</div>
            <h1>{{title}}</h1>
            <p>{{message}}</p>
            <div class="actions">
                <a href="/" class="btn btn-primary">Bosh sahifaga qaytish</a>
                <a href="/info" class="btn btn-outline">Yordam</a>
            </div>
        </div>
    </main>
</body>
</html>
